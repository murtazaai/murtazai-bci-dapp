[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata  (PEP 621)
# ---------------------------------------------------------------------------
[project]
name            = "murtazai-bci-dapp"
version         = "0.1.0"
description     = "EEG signal sim → rig-core LLM agent → Ed25519 provenance → blockchain ledger"
readme          = "README.md"
license         = { text = "MIT" }
authors         = [{ name = "Murtaza Ali Imtiaz", email = "very.kool.king@gmail.com" }]
requires-python = ">=3.11"
keywords        = ["bci", "eeg", "blockchain", "rig-core", "agentic-ai", "ed25519", "web3"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]

# Runtime dependencies
dependencies = [
    "cryptography>=42.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Homepage      = "https://github.com/murtazai/murtazai-bci-dapp"
Documentation = "https://github.com/murtazai/murtazai-bci-dapp#readme"
Repository    = "https://github.com/murtazai/murtazai-bci-dapp"
"Bug Tracker" = "https://github.com/murtazai/murtazai-bci-dapp/issues"

[project.scripts]
bci-dapp = "bci_dapp.cli:main"

# ---------------------------------------------------------------------------
# Tool configs - all in one file, no setup.cfg / tox.ini / .flake8 needed
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/bci_dapp"]

# ── Ruff (linter + formatter, replaces flake8 / isort / black) ─────────────
[tool.ruff]
target-version = "py311"
line-length    = 100
src            = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "TCH",      # flake8-type-checking
    "RUF",      # ruff-specific
]
ignore = ["E501", "TC001", "TC003"]   # E501: length by formatter; TCH: not using TYPE_CHECKING pattern

[tool.ruff.lint.isort]
known-first-party = ["bci_dapp"]

[tool.ruff.format]
quote-style = "double"

# ── Mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version      = "3.11"
strict              = true
warn_return_any     = true
warn_unused_ignores = true
show_error_codes    = true
pretty              = true

[[tool.mypy.overrides]]
module                = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module                 = "numpy.*"
ignore_missing_imports = true

# ── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["src"]
addopts    = "--strict-markers -v --cov=bci_dapp --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/bci_dapp"]
branch = true
omit   = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under   = 80
